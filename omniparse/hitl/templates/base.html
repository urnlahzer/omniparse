<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}OmniParse HITL Review{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
    th { background: #f5f5f5; }
    .region { border: 1px solid #ccc; padding: 1rem; margin: 1rem 0; border-radius: 4px; }
    .region h3 { margin-top: 0; }
    .engine-text { background: #f9f9f9; padding: 0.5rem; margin: 0.25rem 0; font-family: monospace; white-space: pre-wrap; }
    .correction-input { width: 100%; padding: 0.5rem; font-family: monospace; min-height: 3rem; }
    .btn { padding: 0.5rem 1rem; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn:hover { background: #1d4ed8; }
    .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-reviewed { background: #d1fae5; color: #065f46; }
    .confidence-low { color: #dc2626; font-weight: bold; }
  </style>
</head>
<body>
  <h1><a href="/review" style="text-decoration:none;color:inherit;">OmniParse HITL Review</a></h1>
  {% block content %}{% endblock %}
</body>
</html>
