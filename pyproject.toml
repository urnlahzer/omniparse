[project]
name = "omniparse"
version = "0.1.0"
description = "Multi-engine OCR ensemble pipeline on Modal"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pdfplumber>=0.10",
    "Pillow>=10.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pdf2image>=1.16",
    "httpx>=0.27",
    "fastapi>=0.100",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fpdf2>=2.7",
    "rapidfuzz>=3.14",
    "scipy>=1.14",
    "PyYAML>=6.0",
    "sequence-align>=0.3",
]

[tool.pytest.ini_options]
testpaths = ["omniparse/tests"]
pythonpath = ["."]
